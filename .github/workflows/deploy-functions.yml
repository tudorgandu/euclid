name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jfwqgaeepcrhmmmlaexj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy save-session
        run: supabase functions deploy save-session --project-ref "$PROJECT_REF"
      - name: Deploy voce
        run: supabase functions deploy voce --project-ref "$PROJECT_REF"
